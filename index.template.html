  <!-- Instant Theme & FX Hydration (Sanitized) -->
  <script>
    try {
      const validThemes = ['green', 'amber', 'cyan', 'red'];
      const savedTheme = localStorage.getItem('cyber_theme');
      if (savedTheme && validThemes.includes(savedTheme)) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
      const savedBlur = localStorage.getItem('cyber_rain_blur');
      if (savedBlur === 'off') {
        document.documentElement.classList.add('rain-sharp');
      } else {
        document.documentElement.classList.remove('rain-sharp');
      }
    } catch (e) {}
  </script>
