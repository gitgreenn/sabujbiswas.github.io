<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050807" />
      <stop offset="100%" stop-color="#0a120e" />
    </linearGradient>
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="900" height="520" rx="10" fill="url(#bgGrad)" stroke="#1a3528" stroke-width="2"/>
  
  <!-- Grid lines -->
  <g stroke="rgba(0, 255, 136, 0.05)" stroke-width="1">
    <line x1="0" y1="130" x2="900" y2="130"/>
    <line x1="0" y1="260" x2="900" y2="260"/>
    <line x1="0" y1="390" x2="900" y2="390"/>
    <line x1="225" y1="0" x2="225" y2="520"/>
    <line x1="450" y1="0" x2="450" y2="520"/>
    <line x1="675" y1="0" x2="675" y2="520"/>
  </g>

  <!-- Title Badge -->
  <text x="35" y="45" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" fill="#00FF88" letter-spacing="1.5">ENTERPRISE INTER-VLAN ROUTER-ON-A-STICK TOPOLOGY</text>
  <text x="35" y="65" font-family="'JetBrains Mono', monospace" font-size="11" fill="#5a7566">IEEE 802.1Q Encapsulation // Sub-Interfaces // Extended ACL-101 Boundary</text>

  <!-- TOP ROUTER -->
  <g transform="translate(350, 85)">
    <rect x="0" y="0" width="200" height="70" rx="6" fill="#0d1712" stroke="#00FF88" stroke-width="2" filter="url(#glow)"/>
    <circle cx="25" cy="35" r="14" fill="#00FF88" fill-opacity="0.15" stroke="#00FF88"/>
    <text x="21" y="40" font-family="'JetBrains Mono', monospace" font-size="14" fill="#00FF88">R</text>
    <text x="50" y="30" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#ffffff">CISCO ROUTER</text>
    <text x="50" y="48" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00E5FF">ROAS Core Gateway</text>
    <!-- Subinterfaces badges -->
    <text x="10" y="85" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00FF88">g0/0.10: 192.168.10.1</text>
    <text x="10" y="98" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FFB703">g0/0.20: 192.168.20.1</text>
    <text x="10" y="111" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00E5FF">g0/0.30: 192.168.30.1</text>
  </g>

  <!-- TRUNK LINK LINE -->
  <line x1="450" y1="155" x2="450" y2="230" stroke="url(#trunkGrad)" stroke-width="4" stroke-dasharray="6,4"/>
  <rect x="410" y="180" width="80" height="20" rx="4" fill="#050807" stroke="#00E5FF"/>
  <text x="418" y="194" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00E5FF">802.1Q TRUNK</text>

  <!-- MIDDLE SWITCH -->
  <g transform="translate(350, 230)">
    <rect x="0" y="0" width="200" height="60" rx="6" fill="#0d1712" stroke="#00E5FF" stroke-width="2"/>
    <text x="50" y="28" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#ffffff">CATALYST SWITCH</text>
    <text x="50" y="45" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a3b8ad">Layer 2 Managed Distribution</text>
    <circle cx="25" cy="30" r="10" fill="none" stroke="#00E5FF" stroke-width="2"/>
    <line x1="19" y1="30" x2="31" y2="30" stroke="#00E5FF"/>
    <line x1="25" y1="24" x2="25" y2="36" stroke="#00E5FF"/>
  </g>

  <!-- ACCESS LINKS -->
  <!-- Link to VLAN 10 -->
  <path d="M 380 290 L 380 340 L 160 340 L 160 380" fill="none" stroke="#00FF88" stroke-width="2"/>
  <!-- Link to VLAN 20 -->
  <path d="M 450 290 L 450 380" fill="none" stroke="#FFB703" stroke-width="2"/>
  <!-- Link to VLAN 30 -->
  <path d="M 520 290 L 520 340 L 740 340 L 740 380" fill="none" stroke="#00E5FF" stroke-width="2"/>

  <!-- ACL 101 Filter Shield on Guest line -->
  <g transform="translate(415, 330)">
    <rect x="0" y="0" width="70" height="22" rx="4" fill="#ff3366" fill-opacity="0.2" stroke="#ff3366"/>
    <text x="8" y="15" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#ff3366">ACL-101</text>
  </g>

  <!-- DEPARTMENT VLAN BOXES -->
  <!-- VLAN 10: Engineering -->
  <g transform="translate(60, 380)">
    <rect x="0" y="0" width="200" height="110" rx="6" fill="#08140e" stroke="#00FF88" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="26" rx="6" fill="#00FF88" fill-opacity="0.12"/>
    <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#00FF88">VLAN 10: ENGINEERING</text>
    <text x="12" y="45" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ffffff">Subnet: 192.168.10.0/24</text>
    <text x="12" y="65" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a3b8ad">Access Ports: Fa0/1 - Fa0/10</text>
    <text x="12" y="85" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00FF88">Status: Full Internal Clearance</text>
  </g>

  <!-- VLAN 20: Guest -->
  <g transform="translate(350, 380)">
    <rect x="0" y="0" width="200" height="110" rx="6" fill="#141108" stroke="#FFB703" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="26" rx="6" fill="#FFB703" fill-opacity="0.12"/>
    <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#FFB703">VLAN 20: GUEST WI-FI</text>
    <text x="12" y="45" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ffffff">Subnet: 192.168.20.0/24</text>
    <text x="12" y="65" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a3b8ad">Access Ports: Fa0/11 - Fa0/18</text>
    <text x="12" y="85" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ff3366">Blocked to Core Server Farm</text>
  </g>

  <!-- VLAN 30: Server Farm -->
  <g transform="translate(640, 380)">
    <rect x="0" y="0" width="200" height="110" rx="6" fill="#081114" stroke="#00E5FF" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="26" rx="6" fill="#00E5FF" fill-opacity="0.12"/>
    <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#00E5FF">VLAN 30: SERVER FARM</text>
    <text x="12" y="45" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ffffff">Subnet: 192.168.30.0/24</text>
    <text x="12" y="65" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a3b8ad">Access Ports: Gi0/1 - Gi0/4</text>
    <text x="12" y="85" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00E5FF">Protected by Extended ACL</text>
  </g>
</svg>
